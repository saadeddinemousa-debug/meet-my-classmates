<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet My Classmates</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: pair-work journey. White logo band, a two-person strip (A and B), a step rail, one step card at a time. A = blue, B = red; question words keep their colours. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1d2024; --muted:#5a616b; --line:#d9dde2; --soft:#eceef1;
  --red:#c8202a; --red-s:#fbe4e5; --green:#1f7a3a; --green-s:#e1f1e6;
  --a:#1f5fa8; --a-s:#e3edf9; --b:#c8202a; --b-s:#fbe4e5;
  --what:#a64f00; --where:#1f7a3a; --who:#1f5fa8;
  --hi:#ffe27a; --hi-ink:#1d2024;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:Lexend,"Segoe UI",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15181b; --surface:#1e2226; --ink:#eef0f2; --muted:#a6adb6; --line:#363c43; --soft:#272c31;
  --red:#ff6b70; --red-s:#3d1c1e; --green:#6fca88; --green-s:#173022;
  --a:#80b3f0; --a-s:#1b2c42; --b:#ff8a8f; --b-s:#3d1c1e;
  --what:#f3a25a; --where:#6fca88; --who:#80b3f0; --hi:#e8c74a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.brand{background:#ffffff;border-bottom:4px solid #c8202a}
.brand-in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand img{height:52px;width:auto;display:block}
.pairchip{display:flex;gap:6px;flex-wrap:wrap}
.pairchip span{font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px}
.pa{background:#e3edf9;color:#1f5fa8} .pb{background:#fbe4e5;color:#a3161f}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,44px);line-height:1;margin:0}
h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:0}
h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.lead{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.goal{display:inline-flex;background:var(--green-s);color:var(--green);border-radius:99px;padding:4px 14px;font-weight:600;font-size:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--a)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.who{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.who.A{background:var(--a-s)} .who.B{background:var(--b-s)}
.who h3.A{color:var(--a)} .who h3.B{color:var(--b)}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:#c8202a;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.rec{background:#c8202a;color:#fff}
.btn.stop{background:var(--ink);color:var(--bg)}
.link{font:inherit;background:none;border:0;padding:0;color:var(--a);text-decoration:underline;cursor:pointer;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.err{color:var(--red);font-weight:600;margin:0;min-height:24px}
.ok{color:var(--green);font-weight:600}
.note{color:var(--muted);font-size:14px;margin:0}
.banner{background:#fdebd8;color:#7a3c00;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.rail{display:flex;gap:6px;flex-wrap:wrap}
.rail button{font:inherit;font-size:13px;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 12px;cursor:pointer}
.rail button.done{border-color:var(--green);color:var(--green)}
.rail button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.roles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:600}
.tag{border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600}
.tag.A{background:var(--a-s);color:var(--a)} .tag.B{background:var(--b-s);color:var(--b)}
.q{border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.q.done{border-color:var(--green)}
.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.qtext{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15}
.qw-what{color:var(--what)} .qw-where{color:var(--where)} .qw-who{color:var(--who)}
.lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.lines{grid-template-columns:1fr}}
.line{border-radius:10px;padding:8px 12px;font-size:15px}
.line.A{background:var(--a-s)} .line.B{background:var(--b-s)}
.line b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.line.A b{color:var(--a)} .line.B b{color:var(--b)}
.recbox{display:flex;flex-direction:column;gap:6px;background:var(--soft);border-radius:12px;padding:10px 12px}
.recrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:#c8202a;display:inline-block;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
audio{max-width:100%;height:36px}
.st{font-size:14px;font-weight:600}
.st.ok{color:var(--green)} .st.bad{color:var(--red)} .st.wait{color:var(--muted)}
.icon{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
.script{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:19px;line-height:1.7}
.script mark{background:var(--hi);color:var(--hi-ink);border-radius:4px;padding:0 3px}
.toggle{display:flex;gap:6px}
.toggle button{font:inherit;font-size:14px;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 10px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
thead th{background:var(--a-s)}
tbody th{background:var(--soft);width:34%}
.meter{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--green)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 {id:"sports",q:"What are your three favourite sports?",w:"what",me:"My three favourite sports are ___, ___ and ___.",three:true},
 {id:"player",q:"Who is your favourite soccer player?",w:"who",me:"My favourite soccer player is ___."}
];
const STEPS=["Round 1","Round 2","Introduce your partner","Hand in"];
const KEY="alef-pair-interview-v1";
const MAXSEC=60;
/* Saving goes to the teacher's Google Apps Script web app. The link carries its id: ?id=<deployment id> */
function readId(){const m=/[?&]id=([A-Za-z0-9_-]{20,})/.exec(location.search);if(m){try{localStorage.setItem("alef-meet-endpoint",m[1])}catch(e){}return m[1]}
  try{return localStorage.getItem("alef-meet-endpoint")||""}catch(e){return ""}}
const SAVE_ID=readId();
const EXEC=SAVE_ID?"https://script.google.com/macros/s/"+SAVE_ID+"/exec":"";
const connected=!!SAVE_ID;
let practiceOnly=false;
async function api(action,payload){const r=await fetch(EXEC,{method:"POST",body:JSON.stringify({action,payload})});const j=await r.json();if(!j.ok)throw new Error(j.error||"Not saved");return j}
const SPK='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
const MIC='<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';

let S=load();
function fresh(){return {a:"",b:"",cls:"",started:false,step:0,ans:{r1:{},r2:{}},rec:{},pron:{A:"he",B:"he"},submitted:false}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ans){const f=fresh();Object.assign(f,s);Object.values(f.rec).forEach(r=>{if(r.status==="saving")r.status="failed"});return f}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const first=n=>String(n).trim().split(/\s+/)[0];
const qhtml=q=>q.q.replace(/^(What|Where|Who)/,m=>`<span class="qw-${q.w}">${m}</span>`);
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function list3(a){const x=a.map(s=>String(s||"").trim()).filter(Boolean);return x.length<=1?x.join(""):x.slice(0,-1).join(", ")+" and "+x[x.length-1]}
const answerOf=(r,id)=>id==="sports"?list3([r.s1,r.s2,r.s3]):String(r[id]||"").trim();
const filled=r=>QS.filter(q=>answerOf(r,q.id)).length;
const RECKEYS=[...QS.map(q=>"r1-"+q.id),...QS.map(q=>"r2-"+q.id),"introA","introB"];
const recDone=k=>S.rec[k]&&(S.rec[k].status==="saved"||(!connected&&S.rec[k].status==="local"));
const recCount=()=>RECKEYS.filter(recDone).length;
function recLabel(k){if(k==="introA")return first(S.a)+" introduces "+first(S.b);if(k==="introB")return first(S.b)+" introduces "+first(S.a);
  const [r,id]=k.split("-");const q=QS.find(x=>x.id===id);const asker=r==="r1"?first(S.a):first(S.b),ans=r==="r1"?first(S.b):first(S.a);
  return `${r==="r1"?"Round 1":"Round 2"} Q${QS.indexOf(q)+1} (${asker} asks, ${ans} answers)`}

/* ---------- teacher sheet ---------- */
let syncT=null;
function payload(final){
  const fmt=r=>QS.map(q=>q.q.replace("?","")+": "+(answerOf(r,q.id)||"–")).join("\n");
  const links=RECKEYS.filter(k=>S.rec[k]&&S.rec[k].url).map(k=>recLabel(k)+": "+S.rec[k].url).join("\n");
  return {a:S.a,b:S.b,cls:S.cls,status:final?"Finished":(S.step<3?"Working on "+STEPS[S.step]:"Ready to hand in"),
    r1:fmt(S.ans.r1),r2:fmt(S.ans.r2),recCount:RECKEYS.filter(k=>S.rec[k]&&S.rec[k].status==="saved").length,links}}
function sync(final,cb){if(!connected||!S.started){cb&&cb(false);return}
  api("pair",payload(final)).then(()=>cb&&cb(true),()=>cb&&cb(false))}
function queueSync(){clearTimeout(syncT);syncT=setTimeout(()=>sync(false),1500)}

/* ---------- recording ---------- */
let rec=null;           // {key, mr, stream, chunks, t0, timer}
const localAudio={};    // key -> object URL (this session only)
let uploadKey=null;
function mime(){const c=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"];if(!window.MediaRecorder)return "";for(const m of c){try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}}return ""}
async function startRec(key){if(rec)return;
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const m=mime();const mr=m?new MediaRecorder(stream,{mimeType:m}):new MediaRecorder(stream);
    rec={key,mr,stream,chunks:[],t0:Date.now()};mr.ondataavailable=e=>{if(e.data&&e.data.size)rec.chunks.push(e.data)};
    mr.onstop=()=>{const r=rec;rec=null;r.stream.getTracks().forEach(t=>t.stop());clearInterval(r.timer);const blob=new Blob(r.chunks,{type:mr.mimeType||m||"audio/webm"});handleAudio(r.key,blob)};
    mr.start(250);rec.timer=setInterval(()=>{const s=Math.floor((Date.now()-rec.t0)/1000);const el=document.getElementById("t-"+key);if(el)el.textContent=s+"s / "+MAXSEC+"s";if(s>=MAXSEC)stopRec()},250);
    redraw()}
  catch(e){S.rec[key]=Object.assign(S.rec[key]||{},{status:"nomic",msg:e&&e.name==="NotAllowedError"?"allow":"none"});save();redraw()}}
function stopRec(){if(rec&&rec.mr.state!=="inactive")rec.mr.stop()}
function handleAudio(key,blob){if(!blob||!blob.size){S.rec[key]={status:"failed",msg:"The recording was empty. Try again."};save();redraw();return}
  if(blob.size>20*1024*1024){S.rec[key]={status:"failed",msg:"This recording is too long. Keep it under one minute."};save();redraw();return}
  if(localAudio[key])URL.revokeObjectURL(localAudio[key]);localAudio[key]=URL.createObjectURL(blob);
  if(!connected){S.rec[key]={status:"local"};save();redraw();return}
  S.rec[key]={status:"saving"};save();redraw();
  const fr=new FileReader();fr.onload=()=>{const data=String(fr.result).split(",")[1];
    api("recording",{a:S.a,b:S.b,cls:S.cls,label:recLabel(key),mime:blob.type||"audio/webm",data})
      .then(res=>{S.rec[key]={status:"saved",url:res.url};save();redraw();queueSync()},
            ()=>{S.rec[key]={status:"failed",msg:"Not saved. Check the internet and record again."};save();redraw()})};
  fr.readAsDataURL(blob)}
document.getElementById("upl").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f&&uploadKey)handleAudio(uploadKey,f);e.target.value=""};

function recorder(key,prompt){const r=S.rec[key]||{};const live=rec&&rec.key===key;const busy=rec&&rec.key!==key;
  let st="";if(r.status==="saved")st='<span class="st ok">✓ Saved for your teacher</span>';else if(r.status==="saving")st='<span class="st wait">Saving…</span>';
  else if(r.status==="local")st='<span class="st wait">Recorded (practice mode, not sent)</span>';else if(r.status==="failed")st=`<span class="st bad">${esc(r.msg||"Not saved. Try again.")}</span>`;
  else if(r.status==="nomic")st=r.msg==="allow"?'<span class="st bad">The microphone is not allowed. Tap the lock or settings icon next to the web address, allow the microphone, then press Record again. Or tap "Upload a recording".</span>':'<span class="st bad">No microphone was found. Tap "Upload a recording" and use your voice recorder.</span>';
  return `<div class="recbox"><span class="note">${prompt}</span><div class="recrow">
    ${live?`<button class="btn small stop" data-stop="${key}">■ Stop</button><span class="dot" aria-hidden="true"></span><span class="note" id="t-${key}">0s / ${MAXSEC}s</span>`
      :`<button class="btn small rec" data-rec="${key}" ${busy||r.status==="saving"?"disabled":""}>${MIC}${r.status?"Record again":"Record"}</button>`}
    ${localAudio[key]&&!live?`<audio controls src="${localAudio[key]}"></audio>`:""}
    ${!live?`<button class="link" data-up="${key}" ${busy?"disabled":""}>Upload a recording</button>`:""}</div>${st}</div>`}
function bindRec(){document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>startRec(b.dataset.rec));
  document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=stopRec);
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{uploadKey=b.dataset.up;document.getElementById("upl").click()})}

/* ---------- screens ---------- */
function redraw(){const y=window.scrollY;render();window.scrollTo(0,y)}
function render(){const app=document.getElementById("app");const chip=document.getElementById("pairchip");
  chip.innerHTML=S.started?`<span class="pa">A: ${esc(S.a)}</span><span class="pb">B: ${esc(S.b)}</span><span class="pa" style="background:#eceef1;color:#1d2024">${esc(S.cls)}</span>`:"";
  if(!connected&&!practiceOnly&&!S.started){app.innerHTML=teacherSetup();bindSetup();return}
  if(!S.started){app.innerHTML=gate();bindGate();return}
  if(S.submitted){app.innerHTML=finished();bindFinished();return}
  app.innerHTML=`${!connected?'<div class="banner">Practice mode: your work is not sent to a teacher. Use the link your teacher gave you to hand in work.</div>':""}
   <div class="row spread"><nav class="rail" aria-label="Steps">${STEPS.map((s,i)=>`<button data-step="${i}" class="${stepDone(i)?"done":""}" ${i===S.step?'aria-current="step"':""}>${i+1}. ${s}${stepDone(i)?" ✓":""}</button>`).join("")}</nav>
   <span class="note">Recordings: <b>${recCount()} / ${RECKEYS.length}</b></span></div>
   <section class="card">${[round(1),round(2),intro(),handin()][S.step]}</section>`;
  app.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>go(+b.dataset.step));
  [()=>bindRound(1),()=>bindRound(2),bindIntro,bindHandin][S.step]();bindRec()}
function go(n){if(rec)stopRec();S.step=Math.max(0,Math.min(3,n));save();queueSync();render();window.scrollTo(0,0)}
function stepDone(i){if(i===0||i===1){const r="r"+(i+1);return filled(S.ans[r])===5&&QS.every(q=>recDone(r+"-"+q.id))}
  if(i===2)return recDone("introA")&&recDone("introB");return S.submitted}
function navRow(){return `<div class="row spread">${S.step>0?'<button class="btn ghost" id="prev">Back</button>':"<span></span>"}<button class="btn" id="next">Next</button></div>`}
function bindNav(){const p=document.getElementById("prev");if(p)p.onclick=()=>go(S.step-1);const n=document.getElementById("next");if(n)n.onclick=()=>go(S.step+1)}

/* teacher setup (shown when the page has no saving link yet) */
function teacherSetup(){return `<div><h1>Meet My Classmates</h1><p class="lead">Teacher setup: connect this page to your Google Sheet.</p></div>
 <form class="card" id="setupform" novalidate>
  <h2>Paste your Google web app link</h2>
  <p class="note">This is the link you copied after <b>Deploy › New deployment</b> in Apps Script. It ends in <b>/exec</b>.</p>
  <label class="f" for="execurl">Web app link<input type="text" id="execurl" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <p class="err" id="seterr" aria-live="polite"></p>
  <div class="row"><button class="btn" type="submit">Make the student link</button></div>
  <div id="setout"></div>
 </form>
 <div class="row"><button class="link" id="practice">Students: try the game without saving</button></div>`}
function bindSetup(){document.getElementById("practice").onclick=()=>{practiceOnly=true;render()};
  document.getElementById("setupform").onsubmit=async e=>{e.preventDefault();const er=document.getElementById("seterr"),out=document.getElementById("setout");
    const m=/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]{20,})\/exec/.exec(document.getElementById("execurl").value.trim());
    if(!m){er.textContent="That is not a web app link. It should start with https://script.google.com/macros/s/ and end with /exec.";return}
    er.textContent="";out.innerHTML='<p class="note">Checking the connection…</p>';
    let ok=false;try{const r=await fetch("https://script.google.com/macros/s/"+m[1]+"/exec",{method:"POST",body:JSON.stringify({action:"ping"})});ok=(await r.json()).ok}catch(x){}
    const link=location.origin+location.pathname+"?id="+m[1];
    out.innerHTML=(ok?'<p class="ok">✓ Connected to your Google Sheet.</p>':'<p class="err">Could not reach your web app. Check that you chose "Who has access: Anyone" when you deployed, then try again. You can still copy the link below.</p>')+
      `<label class="f" for="stulink">Student link: share this one<input type="text" id="stulink" readonly value="${esc(link)}"></label>
       <div class="row"><button class="btn dark small" type="button" id="copylink">Copy link</button><a class="link" href="${esc(link)}">Open the student page</a><span class="note" id="copymsg"></span></div>`;
    document.getElementById("copylink").onclick=()=>{const i=document.getElementById("stulink");const done=()=>document.getElementById("copymsg").textContent="Copied.";
      try{navigator.clipboard.writeText(i.value).then(done,()=>{i.select();document.getElementById("copymsg").textContent="Press Ctrl+C to copy."})}catch(x){i.select()}}}}

/* gate */
function gate(){return `<span class="goal" style="align-self:flex-start">I can introduce myself to others</span>
 <div><h1>Meet My Classmates</h1><p class="lead">Pair work. Interview your partner, record your questions and answers, then introduce each other.</p></div>
 <form class="card" id="gateform" novalidate>
  <h2>Type both names to start</h2>
  <p class="note">Your teacher will see your names, your answers and your recordings.</p>
  <div class="grid2">
   <div class="who A"><h3 class="A">Student A</h3><label class="f" for="na">Full name<input type="text" id="na" maxlength="40" autocomplete="off" value="${esc(S.a)}" placeholder="First and family name"></label></div>
   <div class="who B"><h3 class="B">Student B</h3><label class="f" for="nb">Full name<input type="text" id="nb" maxlength="40" autocomplete="off" value="${esc(S.b)}" placeholder="First and family name"></label></div>
  </div>
  <label class="f" for="cl">Class<input type="text" id="cl" maxlength="20" autocomplete="off" placeholder="e.g. 7B" value="${esc(S.cls)}"></label>
  <p class="note">You need a microphone. Sit together and use one device.</p>
  <p class="err" id="gateerr" aria-live="polite"></p>
  <div class="row"><button class="btn" type="submit">Start</button></div>
 </form>`}
function bindGate(){document.getElementById("gateform").onsubmit=e=>{e.preventDefault();
  const a=document.getElementById("na").value.trim().replace(/\s+/g," "),b=document.getElementById("nb").value.trim().replace(/\s+/g," "),c=document.getElementById("cl").value.trim(),er=document.getElementById("gateerr");
  if(a.split(" ").length<2){er.textContent="Student A: please type your first name and family name.";document.getElementById("na").focus();return}
  if(b.split(" ").length<2){er.textContent="Student B: please type your first name and family name.";document.getElementById("nb").focus();return}
  if(a.toLowerCase()===b.toLowerCase()){er.textContent="Please type two different names.";return}
  if(!c){er.textContent="Please type your class.";document.getElementById("cl").focus();return}
  S.a=a;S.b=b;S.cls=c;S.started=true;save();sync(false);render()}}

/* rounds */
function round(n){const r="r"+n;const asker=n===1?"A":"B",ansr=n===1?"B":"A";const an=first(n===1?S.a:S.b),bn=first(n===1?S.b:S.a);const R=S.ans[r];
 return `<div><h2>Round ${n}: ${esc(an)} asks, ${esc(bn)} answers</h2>
  <p class="lead">For each question: press <b>Record</b>. ${esc(an)} asks the question. ${esc(bn)} answers in a full sentence. Press <b>Stop</b>. Then write ${esc(bn)}'s answer.</p></div>
 <div class="roles"><span class="tag ${asker}">${asker}: ${esc(an)} asks</span><span class="tag ${ansr}">${ansr}: ${esc(bn)} answers</span></div>
 ${QS.map((q,i)=>{const k=r+"-"+q.id;const ok=answerOf(R,q.id)&&recDone(k);
  return `<div class="q${ok?" done":""}"><div class="qtop"><div class="qtext">${i+1}. ${qhtml(q)}</div><button class="btn ghost small" data-listen="${q.id}">${SPK}Listen</button></div>
   <div class="lines"><div class="line ${asker}"><b>${esc(an)} asks</b>${esc(q.q)}</div><div class="line ${ansr}"><b>${esc(bn)} answers</b>${esc(q.me)}</div></div>
   ${recorder(k,"Record the question and the answer together.")}
   ${q.three?`<div class="grid3">${[1,2,3].map(x=>`<label class="f" for="${r}-s${x}">${esc(bn)}'s sport ${x}<input type="text" id="${r}-s${x}" data-a="s${x}" maxlength="25" value="${esc(R["s"+x])}"></label>`).join("")}</div>`
    :`<label class="f" for="${r}-${q.id}">Write ${esc(bn)}'s answer<input type="text" id="${r}-${q.id}" data-a="${q.id}" maxlength="40" value="${esc(R[q.id])}"></label>`}</div>`}).join("")}
 ${navRow()}`}
function bindRound(n){const r="r"+n;document.querySelectorAll("[data-listen]").forEach(b=>b.onclick=()=>say(QS.find(q=>q.id===b.dataset.listen).q));
  document.querySelectorAll("[data-a]").forEach(inp=>inp.oninput=()=>{S.ans[r][inp.dataset.a]=inp.value;save();queueSync()});bindNav()}

/* introduce */
function introScript(who){const r=who==="A"?S.ans.r1:S.ans.r2;const p=S.pron[who];const H=p==="he"?"He":"She",His=p==="he"?"His":"Her";
  const v=(x,ph)=>x?`<mark>${esc(x)}</mark>`:`<mark>${ph}</mark>`;
  return `This is ${v(answerOf(r,"name"),"name")}. ${H} was born in ${v(answerOf(r,"born"),"place")}. ${H} lives in ${v(answerOf(r,"live"),"place")} now. ${His} three favourite sports are ${v(answerOf(r,"sports"),"sports")}. ${His} favourite soccer player is ${v(answerOf(r,"player"),"player")}.`}
function intro(){const block=(who,speaker,partner,key)=>`<div class="who ${who}"><h3 class="${who}">${esc(first(speaker))} introduces ${esc(first(partner))}</h3>
  <div class="row"><span class="note">${esc(first(partner))} is:</span><div class="toggle"><button data-pr="${who}" data-v="he" aria-pressed="${S.pron[who]==="he"}">he / his</button><button data-pr="${who}" data-v="she" aria-pressed="${S.pron[who]==="she"}">she / her</button></div>
  <button class="btn ghost small" data-say="${who}">${SPK}Listen</button></div>
  <div class="script" id="sc-${who}">${introScript(who)}</div>
  ${recorder(key,esc(first(speaker))+": read the introduction aloud while you record.")}</div>`;
 return `<div><h2>Introduce your partner</h2><p class="lead">Use your partner's answers. Change <b>I</b> to <b>he / she</b> and <b>my</b> to <b>his / her</b>. Record your introduction.</p></div>
  ${block("A",S.a,S.b,"introA")}${block("B",S.b,S.a,"introB")}${navRow()}`}
function bindIntro(){document.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>{S.pron[b.dataset.pr]=b.dataset.v;save();redraw()});
  document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(document.getElementById("sc-"+b.dataset.say).textContent));bindNav()}

/* hand in */
function handin(){const c=recCount(),t=RECKEYS.length;const missing=RECKEYS.filter(k=>!recDone(k));
 return `<div><h2>Hand in your work</h2><p class="lead">Check your recordings and answers, then hand in.</p></div>
  <div><div class="row spread"><b>Recordings</b><span>${c} / ${t}</span></div><div class="meter"><i style="width:${c/t*100}%"></i></div></div>
  ${missing.length?`<p class="note">Still to record: ${missing.map(k=>esc(recLabel(k))).join("; ")}.</p>`:'<p class="ok">All recordings are done. Excellent!</p>'}
  ${table()}
  <p class="err" id="suberr" aria-live="polite"></p>
  <div class="row spread"><button class="btn ghost" id="prev">Back</button><button class="btn" id="submit">Hand in our work</button></div>`}
function table(){return `<div class="tablewrap"><table><thead><tr><th></th><th>${esc(S.b)}</th><th>${esc(S.a)}</th></tr></thead><tbody>
  ${QS.map(q=>`<tr><th>${q.q}</th><td>${esc(answerOf(S.ans.r1,q.id))}</td><td>${esc(answerOf(S.ans.r2,q.id))}</td></tr>`).join("")}</tbody></table></div>`}
function bindHandin(){document.getElementById("prev").onclick=()=>go(2);
  document.getElementById("submit").onclick=()=>{const btn=document.getElementById("submit"),er=document.getElementById("suberr");
    if(!connected){S.submitted=true;save();render();return}
    if(Object.values(S.rec).some(r=>r.status==="saving")){er.textContent="Wait: a recording is still saving.";return}
    btn.disabled=true;btn.textContent="Sending…";
    sync(true,ok=>{if(ok){S.submitted=true;save();render()}else{btn.disabled=false;btn.textContent="Hand in our work";er.textContent="Your work was not sent. Check the internet and try again."}})}}

/* finished */
function finished(){return `<div class="card"><span class="goal" style="align-self:flex-start">I can introduce myself to others</span>
  <h2>Well done, ${esc(first(S.a))} and ${esc(first(S.b))}!</h2>
  <p class="${connected?"ok":"note"}">${connected?"✓ Your work and "+recCount()+" recordings have been handed in to your teacher.":"Practice mode: your work was not sent to a teacher."}</p>
  ${table()}
  <div class="row"><button class="btn ghost" id="edit">Change our work</button><button class="btn" id="newpair">Start a new pair</button></div></div>`}
function bindFinished(){document.getElementById("edit").onclick=()=>{S.submitted=false;S.step=3;save();render()};
  document.getElementById("newpair").onclick=()=>{S=fresh();save();render()}}

render();
</script>
</body>
</html>
