<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How's the Weather?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Lexend:wght@400;600&display=swap">
<style>
/* Layout: white Alef logo band, then a sky-coloured lesson. One activity at a time, a step rail, a score badge and a Portuguese switch that is always in reach. */
:root{
  --bg:#eef4fa; --surface:#ffffff; --ink:#1b2430; --muted:#566273; --line:#d3dde8; --soft:#e6edf5;
  --sky:#1f6fb2; --sky-s:#dcebf8; --sun:#c77700; --sun-s:#fdf0d6; --red:#c8202a; --red-s:#fbe4e5;
  --ok:#1f7a3a; --ok-s:#e1f1e6; --bad:#b3261e; --bad-s:#fbe3e1; --pt:#0d7a5f; --pt-s:#dff3ec; --hi:#ffe27a;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:Lexend,"Segoe UI",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121820; --surface:#1b232d; --ink:#edf1f5; --muted:#a3afbd; --line:#323d4a; --soft:#242e3a;
  --sky:#7db6ec; --sky-s:#1a2c40; --sun:#f2b14e; --sun-s:#3a2c12; --red:#ff6b70; --red-s:#3d1c1e;
  --ok:#6fca88; --ok-s:#173022; --bad:#ff8a80; --bad-s:#3d1d1b; --pt:#5fd1b0; --pt-s:#143229; --hi:#e8c74a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.brand{background:#ffffff;border-bottom:4px solid #c8202a}
.brand-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand img{height:52px;width:auto;display:block}
.who{font-size:13px;font-weight:600;border-radius:99px;padding:4px 12px;background:#eceef1;color:#1d2024}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,46px);line-height:1;margin:0}
h2{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;margin:0}
h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.lead{margin:4px 0 0;color:var(--muted)}
.pt{color:var(--pt);font-size:.92em}
.pt-block{display:block}
.btn .pt,.opt .pt{color:inherit;opacity:.85}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px}
.switch input{appearance:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--pt)} .switch input:checked::after{left:19px}
.score{background:var(--ink);color:var(--bg);border-radius:12px;padding:6px 14px;font-weight:600;font-variant-numeric:tabular-nums}
.rail{display:flex;gap:6px;flex-wrap:wrap}
.rail button{font:inherit;font-size:13px;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 12px;cursor:pointer}
.rail button.done{border-color:var(--ok);color:var(--ok)}
.rail button[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input[type=text]:focus{outline:none;border-color:var(--sky)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;background:#c8202a;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.link{font:inherit;background:none;border:0;padding:0;color:var(--sky);text-decoration:underline;cursor:pointer;font-size:14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{justify-content:space-between}
.err{color:var(--bad);font-weight:600;margin:0;min-height:24px}
.ok{color:var(--ok);font-weight:600;margin:0}
.note{color:var(--muted);font-size:14px;margin:0}
.banner{background:var(--sun-s);color:var(--sun);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.icon{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
svg.wx{display:block}
/* learn */
.words{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.words{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.words{grid-template-columns:1fr}}
.wcard{border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--surface)}
.wcard.heard{border-color:var(--sky)}
.wcard .w{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.wcard .s{font-size:15px}
.extra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
@media (max-width:560px){.extra{grid-template-columns:1fr}}
.extra button{font:inherit;text-align:left;background:var(--soft);border:0;border-radius:10px;padding:8px 12px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.dialog{background:var(--sky-s);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.dialog p{margin:0}
.dialog b{color:var(--sky)}
/* match + listen */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.col{display:flex;flex-direction:column;gap:8px}
.tile{font:inherit;font-weight:600;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:64px;text-align:left}
.tile.sel{border-color:var(--ink);background:var(--hi);color:#1b2430}
.tile.done{border-color:var(--ok);background:var(--ok-s);cursor:default}
.tile.shake{animation:shake .35s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tile .w{font-family:var(--display);font-size:22px;font-weight:800}
.pics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.pics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pic{font:inherit;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer;display:flex;justify-content:center}
.pic.right{border-color:var(--ok);background:var(--ok-s)} .pic.no{border-color:var(--bad);background:var(--bad-s);opacity:.6}
.big{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:14px}
.progress{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sky);transition:width .3s}
/* questions */
.item{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.q{font-size:20px;font-weight:600;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--ink);text-align:center}
.blank.filled{color:var(--ok);border-color:var(--ok)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-weight:600;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 14px;cursor:pointer}
.opt.right{background:var(--ok-s);border-color:var(--ok);color:var(--ok)}
.opt.no{background:var(--bad-s);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
.why{margin:0;font-size:14px;color:var(--muted)} .why b{color:var(--ok)}
.chat{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:520px;border-radius:14px;padding:8px 14px}
.bubble.s{background:var(--sky-s);align-self:flex-start}
.bubble.t{background:var(--sun-s);align-self:flex-end}
.bubble small{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.temp{font-family:var(--display);font-weight:800;font-size:30px}
.check{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ok)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
td.n{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  sunny:`<circle cx="32" cy="32" r="11" fill="${sun}" fill-opacity=".25" stroke="${sun}" stroke-width="2.5"/>${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${32+17*Math.cos(r)}" y1="${32+17*Math.sin(r)}" x2="${32+24*Math.cos(r)}" y2="${32+24*Math.sin(r)}" stroke="${sun}" stroke-width="2.5" stroke-linecap="round"/>`}).join("")}`,

  cold:`<rect x="27" y="8" width="10" height="34" rx="5" fill="none" stroke="${sky}" stroke-width="2.5"/><circle cx="32" cy="48" r="8" fill="${sky}" fill-opacity=".3" stroke="${sky}" stroke-width="2.5"/><line x1="32" y1="26" x2="32" y2="44" stroke="${sky}" stroke-width="4" stroke-linecap="round"/><path d="M46 14v12M40 20h12M42 16l8 8M50 16l-8 8" stroke="${sky}" stroke-width="2" stroke-linecap="round"/>`,

 }[id];
 return `<svg class="wx" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">${body}</svg>`}

/* ---------- state ---------- */
const KEY="alef-weather-v1";
function fresh(){return {name:"",cls:"",started:false,cur:"learn",pt:false,ptUsed:false,heard:{},match:{},listen:{},can:{},talk:{},said:{},order:null,submitted:false}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.match)return Object.assign(fresh(),s)}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shuffle(n,seed){const a=[...Array(n).keys()];let x=seed*9301+49297;for(let i=n-1;i>0;i--){x=(x*9301+49297)%233280;const j=Math.floor(x/233280*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const P=(en,pt)=>S.pt?`${en} <span class="pt">· ${pt}</span>`:en;

function stat(id){const st=S[id]||{};const total=ACTS.find(a=>a.id===id).total;let done=0,score=0;const missed=[];
 if(id==="learn"){done=W.filter(w=>S.heard[w.id]).length;return {done,score:done,total,missed}}
 for(let i=0;i<total;i++){const it=st[i];if(it&&it.done){done++;if(it.first)score++;else missed.push(i)}}return {done,score,total,missed}}
function total(){return SCORED.reduce((s,k)=>s+stat(k).score,0)}
function mark(id,i,ok){const st=S[id];const it=st[i]=st[i]||{tries:0,picked:[]};if(it.done)return;if(ok){it.done=true;it.first=it.tries===0}else it.tries++;save();queueSync()}

/* ---------- saving to the teacher's Google Sheet ---------- */
function readId(){const m=/[?&]id=([A-Za-z0-9_-]{20,})/.exec(location.search);if(m){try{localStorage.setItem("alef-meet-endpoint",m[1])}catch(e){}return m[1]}
  try{return localStorage.getItem("alef-meet-endpoint")||""}catch(e){return ""}}
const SAVE_ID=readId();
const EXEC=SAVE_ID?"https://script.google.com/macros/s/"+SAVE_ID+"/exec":"";
const connected=!!SAVE_ID;let practiceOnly=false;
async function api(action,payload){const r=await fetch(EXEC,{method:"POST",body:JSON.stringify({action,payload})});const j=await r.json();if(!j.ok)throw new Error(j.error||"Not saved");return j}
const LABELS={match:W.map(w=>w.en),listen:W.map(w=>w.s),can:CANQ.map(q=>q.q.replace("___","…")),talk:TALK.map(t=>t.o[t.a])};
function payload(final){const sc={};SCORED.forEach(k=>sc[k]=stat(k).score);
  const missed=SCORED.map(k=>{const m=stat(k).missed;return m.length?ACTS.find(a=>a.id===k).title+": "+m.map(i=>LABELS[k][i]).join("; "):""}).filter(Boolean).join(" | ");
  const done=ACTS.every(a=>stat(a.id).done===a.total);
  return {name:S.name,cls:S.cls,status:final||done?"Finished":"Working on: "+ACTS.find(a=>a.id===S.cur).title,
    learn:stat("learn").done,match:sc.match,listen:sc.listen,can:sc.can,talk:sc.talk,total:total(),max:MAX,
    spoken:Object.keys(S.said).filter(k=>S.said[k]).length,pt:S.ptUsed?"Yes":"No",missed}}
let syncT=null;
function sync(final,cb){if(!connected||!S.started){cb&&cb(false);return}api("weather",payload(final)).then(()=>cb&&cb(true),()=>cb&&cb(false))}
function queueSync(){clearTimeout(syncT);syncT=setTimeout(()=>sync(false),1500)}

/* ---------- screens ---------- */
function redraw(){const y=window.scrollY;render();window.scrollTo(0,y)}
function render(){const app=document.getElementById("app"),who=document.getElementById("who");

 app.innerHTML=`${!connected?'<div class="banner">Practice mode: your scores are not sent to a teacher.</div>':""}

   <div class="row"><label class="switch"><input type="checkbox" id="ptsw" ${S.pt?"checked":""}> Português</label><span class="score" aria-live="polite">${total()} / ${MAX} points</span></div></div>
  <nav class="rail" aria-label="Activities">${ACTS.map((a,i)=>{const s=stat(a.id);const d=s.done===s.total;return `<button data-act="${a.id}" class="${d?"done":""}" ${S.cur===a.id?'aria-current="step"':""}>${i+1}. ${a.title}${d?" ✓":""}</button>`}).join("")}
   <button data-act="report" ${S.cur==="report"?'aria-current="step"':""}>My results</button></nav>
  <section class="card">${({learn,match,listen,can,talk,report})[S.cur]()}</section>`;
 document.getElementById("ptsw").onchange=e=>{S.pt=e.target.checked;if(S.pt)S.ptUsed=true;save();queueSync();redraw()};
 app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>go(b.dataset.act));
 ({learn:bindLearn,match:bindMatch,listen:bindListen,can:bindCan,talk:bindTalk,report:bindReport})[S.cur]()}
function go(id){S.cur=id;save();queueSync();render();window.scrollTo(0,0)}
function nextBtn(){const i=ACTS.findIndex(a=>a.id===S.cur);const nx=i<ACTS.length-1?ACTS[i+1].id:"report";return `<div class="row spread"><span></span><button class="btn" data-go="${nx}">${P("Next","Próximo")}</button></div>`}
function bindNext(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}
function head(title,pt,hint,hpt){return `<div><h2>${P(title,pt)}</h2><p class="lead">${hint}${S.pt?`<span class="pt pt-block">${hpt}</span>`:""}</p></div>`}

/* teacher setup */
function setupScreen(){return `<div><h1>How's the weather?</h1><p class="lead">Teacher setup: connect this lesson to your Google Sheet.</p></div>

 <div class="row"><button class="link" id="practice">Students: try the lesson without saving</button></div>`}
function bindSetup(){document.getElementById("practice").onclick=()=>{practiceOnly=true;render()};
 document.getElementById("setupform").onsubmit=async e=>{e.preventDefault();const er=document.getElementById("seterr"),out=document.getElementById("setout");
  const m=/script\.google\.com\/macros\/s\/([A-Za-z0-9_-]{20,})\/exec/.exec(document.getElementById("execurl").value.trim());
  if(!m){er.textContent="That is not a web app link. It should start with https://script.google.com/macros/s/ and end with /exec.";return}
  er.textContent="";out.innerHTML='<p class="note">Checking the connection…</p>';let ok=false;
  try{const r=await fetch("https://script.google.com/macros/s/"+m[1]+"/exec",{method:"POST",body:JSON.stringify({action:"ping"})});ok=(await r.json()).ok}catch(x){}
  const link=location.origin+location.pathname+"?id="+m[1];
  out.innerHTML=(ok?'<p class="ok">✓ Connected to your Google Sheet.</p>':'<p class="err">Could not reach your web app. Check "Who has access: Anyone", then try again.</p>')+
   `<label class="f" for="stulink">Student link: share this one<input type="text" id="stulink" readonly value="${esc(link)}"></label><div class="row"><button class="btn dark small" type="button" id="copylink">Copy link</button><a class="link" href="${esc(link)}">Open the student page</a><span class="note" id="copymsg"></span></div>`;
  document.getElementById("copylink").onclick=()=>{const i=document.getElementById("stulink");try{navigator.clipboard.writeText(i.value).then(()=>document.getElementById("copymsg").textContent="Copied.",()=>i.select())}catch(x){i.select()}}}}

/* name gate */
function gate(){return `<div><h1>How's the weather?</h1><p class="lead">A weather vocabulary lesson. Learn the words, practise, and talk about the weather.</p></div>
 <form class="card" id="gateform" novalidate><h2>Type your name to start</h2><p class="note">Your teacher will see your name and your score.</p>
  <div class="grid2"><label class="f" for="nm">Full name<input type="text" id="nm" maxlength="40" autocomplete="off" placeholder="First and family name" value="${esc(S.name)}"></label>
  <label class="f" for="cl">Class<input type="text" id="cl" maxlength="20" autocomplete="off" placeholder="e.g. 7B" value="${esc(S.cls)}"></label></div>
  <label class="switch" style="align-self:flex-start"><input type="checkbox" id="ptgate" ${S.pt?"checked":""}> Mostrar português (show Portuguese)</label>
  <p class="err" id="gerr" aria-live="polite"></p><div class="row"><button class="btn" type="submit">Start the lesson</button></div></form>`}
function bindGate(){document.getElementById("gateform").onsubmit=e=>{e.preventDefault();
 const n=document.getElementById("nm").value.trim().replace(/\s+/g," "),c=document.getElementById("cl").value.trim(),er=document.getElementById("gerr");
 if(n.split(" ").length<2){er.textContent="Please type your first name and family name.";document.getElementById("nm").focus();return}
 if(!c){er.textContent="Please type your class.";document.getElementById("cl").focus();return}
 S.name=n;S.cls=c;S.pt=document.getElementById("ptgate").checked;if(S.pt)S.ptUsed=true;S.started=true;save();sync(false);render()}}

/* 1 learn */
function learn(){return head("Learn the words","Aprenda as palavras","Tap each card to hear the word. Say it after the voice.","Toque em cada cartão para ouvir a palavra. Repita depois da voz.")+
 `<div class="words">${W.map(w=>`<div class="wcard${S.heard[w.id]?" heard":""}">${wx(w.id,64)}<span class="w">${w.en}</span>${S.pt?`<span class="pt">${w.pt}</span>`:""}
   <span class="s"><b>${w.s}</b> ${w.ex}${S.pt?`<span class="pt pt-block">${w.spt} ${w.expt}</span>`:""}</span>
   <button class="btn dark small" data-hear="${w.id}">${SPK}Listen</button></div>`).join("")}</div>
 <p class="note">${stat("learn").done} / 6 words heard</p>
 <h3>${P("Useful words","Palavras úteis")}</h3>
 <div class="extra">${EXTRA.map(([en,pt])=>`<button data-say="${esc(en)}"><span><b>${en}</b>${S.pt?` <span class="pt">· ${pt}</span>`:""}</span>${SPK}</button>`).join("")}</div>
 <h3>${P("Questions","Perguntas")}</h3>
 <div class="dialog"><p><b>How's the weather?</b> ${S.pt?'<span class="pt">· Como está o tempo?</span>':""} <button class="link" data-say="How's the weather?">Listen</button></p>
  <p><b>What's the temperature?</b> ${S.pt?'<span class="pt">· Qual é a temperatura?</span>':""} <button class="link" data-say="What's the temperature?">Listen</button></p>
  <p>It's cold, 13 degrees. ${S.pt?'<span class="pt">· Está frio, 13 graus.</span>':""} <button class="link" data-say="It's cold, 13 degrees.">Listen</button></p></div>`+nextBtn()}
function bindLearn(){document.querySelectorAll("[data-hear]").forEach(b=>b.onclick=()=>{const w=W.find(x=>x.id===b.dataset.hear);say(w.en+". "+w.s+" "+w.ex);S.heard[w.id]=true;save();queueSync();redraw()});
 document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));bindNext()}

/* 2 match */
let selPic=null;
function match(){const order=shuffle(6,7);return head("Match","Ligue","Tap a picture, then tap the word.","Toque em uma imagem e depois na palavra.")+
 `<div class="board"><div class="col">${W.map((w,i)=>{const d=S.match[i]&&S.match[i].done;return `<button class="tile${d?" done":""}${selPic===i?" sel":""}" data-pic="${i}" aria-label="Picture ${i+1}" ${d?"disabled":""}>${wx(w.id,48)}${d?`<span class="w">${w.en}</span>`:""}</button>`}).join("")}</div>
  <div class="col">${order.map(i=>{const w=W[i],d=S.match[i]&&S.match[i].done;return `<button class="tile${d?" done":""}" data-word="${i}" ${d?"disabled":""}><span class="w">${w.en}</span>${S.pt?`<span class="pt">${w.pt}</span>`:""}</button>`}).join("")}</div></div>
 <p class="ok" id="mfb" aria-live="polite">${stat("match").done===6?"All matched! "+stat("match").score+" / 6 first time.":""}</p>`+nextBtn()}
function bindMatch(){document.querySelectorAll("[data-pic]").forEach(b=>b.onclick=()=>{selPic=+b.dataset.pic;document.querySelectorAll("[data-pic]").forEach(x=>x.classList.toggle("sel",x===b))});
 document.querySelectorAll("[data-word]").forEach(b=>b.onclick=()=>{if(selPic===null){const f=document.getElementById("mfb");f.className="err";f.textContent="First tap a picture.";return}
  const i=+b.dataset.word;if(i===selPic){mark("match",selPic,true);say(W[i].en);selPic=null;redraw()}else{mark("match",selPic,false);b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}});bindNext()}

/* 3 listen */
function listen(){const order=S.order||(S.order=shuffle(6,11));const done=stat("listen").done;const k=order.find(i=>!(S.listen[i]&&S.listen[i].done));
 const body=k===undefined?`<p class="ok">Finished! ${stat("listen").score} / 6 right the first time.</p>`
  :`<div class="big"><button class="btn dark" id="play">${SPK}Play the sentence</button><span class="note">${P("Which picture is it?","Qual é a imagem?")}</span></div>
    <div class="pics">${shuffle(6,k+3).map(i=>{const no=(S.listen[k]&&S.listen[k].picked||[]).includes(i);return `<button class="pic${no?" no":""}" data-pick="${i}" aria-label="${W[i].en}" ${no?"disabled":""}>${wx(W[i].id,72)}</button>`}).join("")}</div><p class="err" id="lfb" aria-live="polite"></p>`;
 return head("Listen and choose","Ouça e escolha","Press play. Listen to the sentence and tap the right picture.","Aperte play. Ouça a frase e toque na imagem certa.")+
 `<div class="progress"><i style="width:${done/6*100}%"></i></div>`+body+nextBtn()}
function bindListen(){const order=S.order;const k=order.find(i=>!(S.listen[i]&&S.listen[i].done));
 const p=document.getElementById("play");if(p)p.onclick=()=>say(W[k].s+" "+W[k].ex);
 document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{const i=+b.dataset.pick;
  if(i===k){mark("listen",k,true);redraw();const n=order.find(j=>!(S.listen[j]&&S.listen[j].done));if(n!==undefined)setTimeout(()=>say(W[n].s+" "+W[n].ex),500)}
  else{mark("listen",k,false);S.listen[k].picked.push(i);save();redraw();document.getElementById("lfb").textContent="Listen again and try another picture."}});bindNext()}

/* 4 can / can't */
function can(){return head("Can or can't?","Pode ou não pode?","Look at the weather. Choose the right word.","Olhe o tempo. Escolha a palavra certa.")+
 `<div>${CANQ.map((q,i)=>{const s=S.can[i]||{picked:[]};const parts=q.q.split("___");
  return `<div class="item"><div class="q">${wx(q.w,44)}<span>${parts[0]}<span class="blank${s.done?" filled":""}">${s.done?q.o[q.a]:"&nbsp;"}</span>${parts[1]}${S.pt?`<span class="pt pt-block">${q.pt}</span>`:""}</span></div>
   <div class="opts">${q.o.map((o,k)=>`<button class="opt${s.done&&k===q.a?" right":""}${s.picked.includes(k)?" no":""}" data-ci="${i}" data-k="${k}" ${s.done||s.picked.includes(k)?"disabled":""}>${o}</button>`).join("")}</div>
   ${s.done?`<p class="why"><b>${s.first?"Correct!":"Got it."}</b> ${q.q.replace("___",q.o[q.a])}</p>`:""}</div>`}).join("")}</div>`+nextBtn()}
function bindCan(){document.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ci,k=+b.dataset.k,q=CANQ[i];
 if(k===q.a){mark("can",i,true);say(q.q.replace("___",q.o[q.a]))}else{mark("can",i,false);S.can[i].picked.push(k);save()}redraw()});bindNext()}

/* 5 talk */
function talk(){return head("Talk about the weather","Fale sobre o tempo","Your teacher asks a question. Choose the right answer. Then say it aloud.","O professor faz uma pergunta. Escolha a resposta certa. Depois fale em voz alta.")+
 `<div>${TALK.map((t,i)=>{const s=S.talk[i]||{picked:[]};const ord=shuffle(3,i+5);
  return `<div class="item"><div class="row">${wx(t.w,56)}<span class="temp">${t.t}C</span></div>
   <div class="chat"><div class="bubble s"><small>Student</small>${t.q} <button class="link" data-say="${esc(t.q)}">Listen</button></div>
   ${s.done?`<div class="bubble t"><small>Teacher</small>${t.o[t.a]} <button class="link" data-say="${esc(t.o[t.a])}">Listen</button></div>`:""}</div>
   ${s.done?`<label class="check"><input type="checkbox" data-said="${i}" ${S.said[i]?"checked":""}> ${P("I said it aloud.","Eu falei em voz alta.")}</label>`
    :`<div class="opts">${ord.map(k=>`<button class="opt${s.picked.includes(k)?" no":""}" data-ti="${i}" data-k="${k}" ${s.picked.includes(k)?"disabled":""}>${t.o[k]}</button>`).join("")}</div>`}</div>`}).join("")}</div>`+nextBtn()}
function bindTalk(){document.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>say(b.dataset.say));
 document.querySelectorAll("[data-ti]").forEach(b=>b.onclick=()=>{const i=+b.dataset.ti,k=+b.dataset.k,t=TALK[i];
  if(k===t.a){mark("talk",i,true);say(t.o[t.a])}else{mark("talk",i,false);S.talk[i].picked.push(k);save()}redraw()});
 document.querySelectorAll("[data-said]").forEach(c=>c.onchange=()=>{S.said[c.dataset.said]=c.checked;save();queueSync()});bindNext()}

/* results */
function report(){const allDone=ACTS.every(a=>stat(a.id).done===a.total);
 return `<div><h2>${P("My results","Meus resultados")}</h2><p class="lead">Points count when you are right the first time.</p></div>
 <table><tbody>${ACTS.map((a,i)=>{const s=stat(a.id);return `<tr><td>${i+1}. ${a.title}</td><td class="n">${a.id==="learn"?s.done+" / 6 heard":s.score+" / "+s.total}</td></tr>`}).join("")}
 <tr><td><b>Total</b></td><td class="n"><b>${total()} / ${MAX}</b></td></tr></tbody></table>
 ${allDone?"":'<p class="note">Some activities are not finished yet. You can still hand in.</p>'}
 <p class="${S.submitted?"ok":"err"}" id="rfb" aria-live="polite">${S.submitted?(connected?"✓ Handed in to your teacher.":"Practice mode: not sent to a teacher."):""}</p>
 <div class="row spread"><button class="btn ghost" id="newst">Not ${esc(S.name.split(" ")[0])}? New student</button><button class="btn" id="handin">${S.submitted?"Hand in again":"Hand in"}</button></div>`}
function bindReport(){document.getElementById("handin").onclick=()=>{const b=document.getElementById("handin"),f=document.getElementById("rfb");
  if(!connected){S.submitted=true;save();render();return}b.disabled=true;b.textContent="Sending…";
  sync(true,ok=>{if(ok){S.submitted=true;save();render()}else{b.disabled=false;b.textContent="Hand in";f.className="err";f.textContent="Not sent. Check the internet and try again."}})};
 document.getElementById("newst").onclick=()=>{const pt=S.pt;S=fresh();S.pt=pt;save();render()}}

render();document.getElementById("app").dataset.ok="1";
</script>
</body>
</html>
